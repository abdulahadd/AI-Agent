services:
  livekit-server:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    environment:
      - LIVEKIT_AGENT_ENABLED=true
      - LIVEKIT_AGENT_NAME=sales-agent # Forces the server to associate blank requests with this name
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7880:7880"    # LiveKit server port
      - "7881:7881"    # LiveKit WebSocket port
      # - "5060:5060/udp"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - livekit-network
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]

  redis:
    image: redis:7-alpine
    container_name: livekit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - livekit-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: local_asterisk
    network_mode: "host" # Allows seamless UDP SIP/RTP packet routing
    env_file: .env
    volumes:
      - ./pjsip.conf.template:/etc/asterisk/pjsip.conf.template:ro
      - ./config/asterisk:/etc/asterisk
    command: >
      sh -c "
        envsubst '$$PUBLIC_IP $$PJSIP_SECRET' < /etc/asterisk/pjsip.conf.template > /etc/asterisk/pjsip.conf &&
        asterisk -f
      "
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sip-setup:
    build:
      context: .
      dockerfile: agents/Dockerfile
    command: python3 setup_sip.py
    env_file: .env
    networks:
      - livekit-network
    restart: "no" # Runs once to set up SIP dispatches, then exits
    depends_on:
      - livekit-server

  sales-agent:
    build:
      context: .
      dockerfile: agents/Dockerfile
    command: python3 agents/agent.py start
    env_file: .env
    network_mode: "host"
    restart: "no" # Will not keep running if you shut down SSH / exit
    depends_on:
      sip-setup:
        condition: service_completed_successfully # Waits until SIP setup finishes 0 exit code


volumes:
  redis-data:

networks:
  livekit-network:
    driver: bridge

