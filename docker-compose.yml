services:
  livekit-server:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    environment:
      - LIVEKIT_AGENT_ENABLED=true
      - LIVEKIT_AGENT_NAME=sales-agent # Forces the server to associate blank requests with this name
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7880:7880"    # LiveKit server port
      - "7881:7881"    # LiveKit WebSocket port
      - "5060:5060/udp"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - livekit-network
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]

  redis:
    image: redis:7-alpine
    container_name: livekit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - livekit-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: local_asterisk
    network_mode: "host" # Allows seamless UDP SIP/RTP packet routing
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis-data:

networks:
  livekit-network:
    driver: bridge

