[global]
type=global
user_agent=Asterisk-Local-Test

; 1. SIP Transport Configuration
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5070

; 2. Local Softphone Endpoint ( MicroSIP)
[1000]
type=endpoint
context=from-softphone
disallow=all
allow=ulaw,alaw,opus
auth=auth1000
aors=1000

[auth1000]
type=auth
auth_type=userpass
username=1000
password=1234


[1000]
type=aor
max_contacts=1
remove_existing=yes

; 3. LiveKit SIP Trunk Endpoint
[livekit-trunk]
type=endpoint
transport=transport-udp
context=from-asterisk
disallow=all
allow=ulaw,alaw,opus
aors=livekit-aor

[livekit-aor]
type=aor
; Point directly to host address or livekit sip gateway container
contact=sip:host.docker.internal:5060